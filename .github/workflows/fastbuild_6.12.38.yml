name: 6.12.38 极简网卡增强版内核(全驱动打包)

env:
  TZ: Asia/Shanghai
  KERNEL_VERSION: '6.12'
  SUB_VERSION: '38'

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: 安装环境依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils python-is-python3 libssl-dev libelf-dev libdw-dev bc bison flex zip unzip aria2

      - name: 下载源码及工具链
        run: |
          mkdir -p kernel_workspace && cd kernel_workspace
          
          aria2c -s16 -x16 -k1M https://github.com/cctv18/android_kernel_common_oneplus_sm8845/archive/refs/heads/oneplus/sm8845_b_16.0.0_ace_6t.zip -o common.zip
          unzip -q common.zip && mv android_kernel_common_oneplus_sm8845-oneplus-sm8845_b_16.0.0_ace_6t common && rm -f common.zip
          
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/clang-r536225.zip -o clang.zip
          mkdir -p clang19 && unzip -q clang.zip -d clang19 && rm -f clang.zip
          
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/rust.zip -o rust.zip
          mkdir -p rust && unzip -q rust.zip -d rust && rm -f rust.zip
          
          aria2c -s16 -x16 -k1M https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/build-tools.zip -o build-tools.zip
          unzip -q build-tools.zip && rm -f build-tools.zip

      - name: 注入极简网卡配置 (一行一行 echo 写入)
        run: |
          cd kernel_workspace/common
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang19/bin:$GITHUB_WORKSPACE/kernel_workspace/build-tools/bin:$GITHUB_WORKSPACE/kernel_workspace/rust/bin:$PATH"
          
          make ARCH=arm64 LLVM=1 CC=clang O=out gki_defconfig
          
          echo "CONFIG_USB_USBNET=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_USB_NET_CDCETHER=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_MT7601U=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_MT76x0U=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_MT76x2U=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_RTL8187=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_RTL8192CU=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_RTL8XXXU=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_RTL8XXXU_UNTESTED=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_ATH9K_HTC=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_CARL9170=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_RT2800USB=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_CFG80211=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_MAC80211=m" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_CFG80211_WEXT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_RFKILL=m" >> arch/arm64/configs/gki_defconfig
          
          make ARCH=arm64 LLVM=1 CC=clang O=out olddefconfig

      - name: 编译内核
        run: |
          cd kernel_workspace/common
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang19/bin:$GITHUB_WORKSPACE/kernel_workspace/build-tools/bin:$GITHUB_WORKSPACE/kernel_workspace/rust/bin:$PATH"
          make -j$(nproc --all) ARCH=arm64 LLVM=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm AS=clang OBJCOPY=llvm-objcopy O=out Image modules

      - name: 打包 AK3 (打包全部独立模块)
        run: |
          cd kernel_workspace
          git clone --depth=1 https://github.com/cctv18/AnyKernel3.git
          cd AnyKernel3
          
          cp ../common/out/arch/arm64/boot/Image ./Image
          
          # 开启模块推送
          sed -i 's/^do.modules=.*/do.modules=1/' ./anykernel.sh
          
          KVER=$(cat ../common/out/include/config/kernel.release)
          echo "内核版本号: $KVER"
          
          mkdir -p ./modules/lib/modules/"$KVER"
          
          # 【全量抓取】把 out 目录下所有的 .ko 文件全部复制进刷机包
          find ../common/out -name "*.ko" -exec cp {} ./modules/lib/modules/"$KVER"/ \;
          
          # 顺便统计一下带了多少个模块
          KO_COUNT=$(ls -1 ./modules/lib/modules/"$KVER"/*.ko | wc -l)
          echo "共打包了 $KO_COUNT 个内核模块！"
          
          zip -r9 ../AnyKernel3_AllWifi_$KVER.zip ./*

      - name: 上传刷机包
        uses: actions/upload-artifact@v4
        with:
          name: All-Wifi-Kernel
          path: kernel_workspace/AnyKernel3_AllWifi_*.zip
